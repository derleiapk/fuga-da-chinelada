name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Copiar o motor 3D (three.js) para dentro do app
        run: npm run copy-three

      - name: Criar o projeto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Gerar ícone e tela de abertura
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#ff9fc0' --iconBackgroundColorDark '#ff9fc0' --splashBackgroundColor '#ff9fc0' --splashBackgroundColorDark '#ff9fc0'

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: fuga-da-chinelada-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
